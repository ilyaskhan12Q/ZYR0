<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e03"/>
      <stop offset="50%" stop-color="#241605"/>
      <stop offset="100%" stop-color="#080401"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="600" cy="380" r="420" fill="url(#glow)"/>

  <!-- Blueprint Grid -->
  <g stroke="#f59e0b" stroke-opacity="0.06" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="800"/>
    <line x1="280" y1="0" x2="280" y2="800"/>
    <line x1="440" y1="0" x2="440" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="760" y1="0" x2="760" y2="800"/>
    <line x1="920" y1="0" x2="920" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Top Hero Header Bar -->
  <g transform="translate(60, 48)">
    <rect width="160" height="32" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="80" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.1em">OPEN PLATFORM</text>
    <text x="180" y="24" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Developer Engine</text>
    <text x="440" y="23" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">— CLI tooling, open REST APIs, Git sync &amp; edge deploy</text>
    
    <rect x="940" y="4" width="140" height="32" rx="8" fill="#451a03" stroke="#78350f" stroke-width="1"/>
    <circle cx="958" cy="20" r="4" fill="#fbbf24"/>
    <text x="970" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fde68a">v2.4 CLI Ready</text>
  </g>

  <!-- Widescreen CLI & API Gateway Workspace Mockup -->
  <g transform="translate(60, 110)">
    <rect width="1080" height="630" rx="16" fill="#0c0702" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="1080" height="630" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Window Header -->
    <rect width="1080" height="46" rx="16" fill="#1f1105" fill-opacity="0.9"/>
    <circle cx="28" cy="23" r="6" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="48" cy="23" r="6" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="68" cy="23" r="6" fill="#10b981" fill-opacity="0.8"/>
    <text x="240" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fde68a">Developer Engine · CLI Pipeline &amp; Edge Network Telemetry</text>

    <!-- Content: Split View (Interactive Terminal on Left, Live API Gateway on Right) -->
    <g transform="translate(24, 66)">
      <!-- Left: Terminal (width 540) -->
      <g>
        <rect width="540" height="538" rx="12" fill="#060301" stroke="#451a03" stroke-width="1.5"/>
        <rect width="540" height="44" rx="12" fill="#1c0c03" fill-opacity="0.7"/>
        <text x="20" y="27" font-family="monospace" font-size="12" font-weight="700" fill="#fde68a">zsh — 80x24</text>

        <!-- Terminal Output -->
        <g transform="translate(20, 64)" font-family="monospace" font-size="12" line-height="24">
          <text x="0" y="0" fill="#a8a29e">$ npx @zyro/cli init my-enterprise-app</text>
          <text x="0" y="26" fill="#34d399">✔ Scaffolded React 19 + Tailwind v4 + TypeScript workspace</text>

          <text x="0" y="60" fill="#a8a29e">$ zyro agent generate "multi-tenant billing with stripe webhooks"</text>
          <text x="0" y="86" fill="#fbbf24">✦ Planning agent graph with 4 subagents...</text>
          <text x="0" y="112" fill="#a8a29e">  - Subagent 1: Synthesizing database migrations in Neon SQL</text>
          <text x="0" y="138" fill="#a8a29e">  - Subagent 2: Generating idempotent webhook handler</text>
          <text x="0" y="164" fill="#a8a29e">  - Subagent 3: Assembling test suite (14/14 tests passed)</text>
          <text x="0" y="190" fill="#34d399">✔ Generated 8 source files (0.84s)</text>

          <text x="0" y="224" fill="#a8a29e">$ zyro deploy --production</text>
          <text x="0" y="250" fill="#38bdf8">🚀 Bundling edge worker container...</text>
          <text x="0" y="276" fill="#a8a29e">  - Edge region: iad1 (North America), fra1 (Europe), sin1 (Asia)</text>
          <text x="0" y="302" fill="#a8a29e">  - Cold start: 0ms (pre-warmed isolates)</text>
          <text x="0" y="328" fill="#34d399">✔ Live deployment active:</text>
          <text x="0" y="354" fill="#fbbf24">  👉 https://app.zyroo.org (Edge DNS synced)</text>

          <!-- Prompt cursor line -->
          <text x="0" y="400" fill="#a8a29e">$</text>
          <rect x="14" y="388" width="8" height="15" fill="#f59e0b"/>
        </g>
      </g>

      <!-- Right: Open REST API & Live Logs (width 480) -->
      <g transform="translate(564, 0)">
        <rect width="474" height="538" rx="12" fill="#060301" stroke="#451a03" stroke-width="1.5"/>
        <rect width="474" height="44" rx="12" fill="#1c0c03" fill-opacity="0.7"/>
        <text x="20" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">OPEN REST API GATEWAY</text>

        <!-- API Request Block -->
        <g transform="translate(20, 64)">
          <rect width="434" height="160" rx="10" fill="#130902" stroke="#291103" stroke-width="1"/>
          <g transform="translate(18, 24)" font-family="monospace" font-size="11">
            <text x="0" y="0" fill="#f59e0b">POST /v1/autonomous/research HTTP/2</text>
            <text x="0" y="22" fill="#a8a29e">Host: api.zyroo.org</text>
            <text x="0" y="44" fill="#a8a29e">Authorization: Bearer zyr_live_9a72b...</text>
            <text x="0" y="66" fill="#a8a29e">Content-Type: application/json</text>
            <text x="0" y="94" fill="#fbbf24">{"topic": "LCP Optimization", "depth": "exhaustive"}</text>
          </g>

          <!-- Response snippet -->
          <g transform="translate(0, 180)">
            <rect width="434" height="160" rx="10" fill="#130902" stroke="#291103" stroke-width="1"/>
            <g transform="translate(18, 24)" font-family="monospace" font-size="11">
              <text x="0" y="0" fill="#34d399">HTTP/2 200 OK</text>
              <text x="0" y="22" fill="#a8a29e">x-zyro-latency: 48ms · region: iad1</text>
              <text x="0" y="44" fill="#a8a29e">{</text>
              <text x="16" y="66" fill="#fde68a">"status": "completed",</text>
              <text x="16" y="88" fill="#fde68a">"confidence": 0.998,</text>
              <text x="16" y="110" fill="#fde68a">"citations": ["arXiv:2409.1204"]</text>
              <text x="0" y="132" fill="#a8a29e">}</text>
            </g>
          </g>

          <!-- Docs Button -->
          <g transform="translate(0, 360)">
            <rect width="434" height="60" rx="10" fill="#1c0c03" stroke="#451a03" stroke-width="1"/>
            <text x="20" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Integrate into your CI/CD</text>
            <text x="20" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">SDKs for Python, Node.js, Go, and GitHub Actions</text>
            <rect x="320" y="14" width="95" height="32" rx="6" fill="#f59e0b"/>
            <text x="367" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0a0501" text-anchor="middle">API Docs ↗</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
