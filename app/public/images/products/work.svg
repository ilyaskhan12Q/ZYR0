<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04140d"/>
      <stop offset="50%" stop-color="#072217"/>
      <stop offset="100%" stop-color="#010805"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="600" cy="380" r="420" fill="url(#glow)"/>

  <!-- Blueprint Grid -->
  <g stroke="#34d399" stroke-opacity="0.06" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="800"/>
    <line x1="280" y1="0" x2="280" y2="800"/>
    <line x1="440" y1="0" x2="440" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="760" y1="0" x2="760" y2="800"/>
    <line x1="920" y1="0" x2="920" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Top Hero Header Bar -->
  <g transform="translate(60, 48)">
    <rect width="170" height="32" rx="16" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="85" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.1em">INTERNSHIP ENGINE</text>
    <text x="190" y="24" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">ZYR0 Work</text>
    <text x="370" y="23" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">— Project-driven internships with cryptographic proof</text>
    
    <rect x="920" y="4" width="160" height="32" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="938" cy="20" r="4" fill="#34d399"/>
    <text x="950" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">Verified Certificate</text>
  </g>

  <!-- Widescreen Work & PR Drawer Workspace Mockup -->
  <g transform="translate(60, 110)">
    <rect width="1080" height="630" rx="16" fill="#05120b" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="1080" height="630" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Window Header -->
    <rect width="1080" height="46" rx="16" fill="#0c2317" fill-opacity="0.9"/>
    <circle cx="28" cy="23" r="6" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="48" cy="23" r="6" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="68" cy="23" r="6" fill="#10b981" fill-opacity="0.8"/>
    <text x="240" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">ZYR0 Work · PR Code Review &amp; On-Chain Verification</text>

    <!-- Content: 2-column split (GitHub PR on Left, Verified Certificate on Right) -->
    <g transform="translate(24, 66)">
      <!-- Left: GitHub PR Code Review Drawer (width 620) -->
      <g>
        <rect width="620" height="538" rx="12" fill="#06180f" stroke="#064e3b" stroke-width="1.5"/>
        <rect width="620" height="52" rx="12" fill="#0d281a" fill-opacity="0.7"/>

        <!-- PR status pill & Title -->
        <g transform="translate(20, 15)">
          <rect width="76" height="24" rx="12" fill="#10b981" fill-opacity="0.2"/>
          <text x="38" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">MERGED</text>
          <text x="90" y="17" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">#182 feat(engine): distributed caching pipeline</text>
        </g>

        <!-- PR Meta details -->
        <g transform="translate(20, 68)">
          <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Submitted by <tspan fill="#34d399">@alex_developer</tspan> · Reviewed by Staff Architect (Stripe Guild)</text>

          <!-- Code Diff Pane -->
          <g transform="translate(0, 30)">
            <rect width="580" height="290" rx="10" fill="#020805" stroke="#064e3b" stroke-width="1"/>
            
            <g transform="translate(18, 28)" font-family="monospace" font-size="12" line-height="24">
              <text x="0" y="0" fill="#6ee7b7">@@ -42,8 +42,12 @@ export class DistributedCluster</text>
              <text x="0" y="26" fill="#94a3b8">  async acquireLock(key: string): Promise&lt;Lock&gt; {</text>

              <rect x="-6" y="38" width="550" height="24" fill="#065f46" fill-opacity="0.3"/>
              <text x="0" y="54" fill="#34d399">+   const node = await this.ring.getHealthyNode(key);</text>

              <rect x="-6" y="64" width="550" height="24" fill="#065f46" fill-opacity="0.3"/>
              <text x="0" y="80" fill="#34d399">+   const session = await node.openAtomicSession({ timeout: 5000 });</text>

              <rect x="-6" y="90" width="550" height="24" fill="#065f46" fill-opacity="0.3"/>
              <text x="0" y="106" fill="#34d399">+   logger.info(`Acquired distributed lock for ${key}`);</text>

              <text x="0" y="132" fill="#94a3b8">    return session.lock;</text>
              <text x="0" y="158" fill="#94a3b8">  }</text>

              <rect x="-6" y="170" width="550" height="24" fill="#065f46" fill-opacity="0.3"/>
              <text x="0" y="186" fill="#34d399">+ export const clusterMetrics = new TelemetryMetric("cache_hits");</text>
            </g>
          </g>

          <!-- Review Approval Note -->
          <g transform="translate(0, 335)">
            <rect width="580" height="84" rx="8" fill="#0c2317" stroke="#064e3b" stroke-width="1"/>
            <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.3"/>
            <text x="52" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Mentor Evaluation: Grade A+ (Production Quality)</text>
            <text x="52" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#a7f3d0">"Clean separation of concerns, exhaustive unit tests, and verified zero deadlock risk."</text>
            <text x="52" y="64" font-family="monospace" font-size="10" fill="#6ee7b7">Signed ECDSA key: 0x892a...f402</text>
          </g>
        </g>
      </g>

      <!-- Right: Cryptographic Certificate & Proof (width 400) -->
      <g transform="translate(638, 0)">
        <rect width="400" height="538" rx="12" fill="#06180f" stroke="#064e3b" stroke-width="1.5"/>
        <rect width="400" height="52" rx="12" fill="#0d281a" fill-opacity="0.7"/>
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">VERIFIABLE CREDENTIAL</text>

        <!-- Certificate Card -->
        <g transform="translate(20, 72)">
          <rect width="360" height="434" rx="10" fill="#030d07" stroke="#059669" stroke-width="1"/>
          
          <!-- Badge Icon -->
          <circle cx="180" cy="60" r="32" fill="#065f46" stroke="#34d399" stroke-width="2"/>
          <path d="M 170 60 L 176 66 L 190 52" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

          <text x="180" y="118" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Certificate of Engineering Mastery</text>
          <text x="180" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">Issued to Alex Developer · Batch 2026</text>

          <g transform="translate(20, 160)" font-family="system-ui, sans-serif" font-size="12">
            <rect width="320" height="44" rx="6" fill="#0c2317"/>
            <text x="14" y="18" fill="#94a3b8">Specialization</text>
            <text x="14" y="34" font-weight="700" fill="#ffffff">Distributed Systems &amp; Concurrency</text>

            <g transform="translate(0, 52)">
              <rect width="320" height="44" rx="6" fill="#0c2317"/>
              <text x="14" y="18" fill="#94a3b8">Tasks Merged</text>
              <text x="14" y="34" font-weight="700" fill="#ffffff">12 Production Pull Requests</text>
            </g>

            <g transform="translate(0, 104)">
              <rect width="320" height="44" rx="6" fill="#0c2317"/>
              <text x="14" y="18" fill="#94a3b8">Verification Hash</text>
              <text x="14" y="34" font-family="monospace" font-size="10" font-weight="600" fill="#34d399">sha256:7f8a92cb...8912</text>
            </g>
          </g>

          <rect x="20" y="375" width="320" height="36" rx="8" fill="#10b981"/>
          <text x="180" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#021208" text-anchor="middle">Verify Authenticity Online ↗</text>
        </g>
      </g>
    </g>
  </g>
</svg>
