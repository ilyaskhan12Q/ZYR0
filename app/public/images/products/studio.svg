<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0c1427"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Ambient Glow & Radial Backdrop -->
  <circle cx="600" cy="380" r="420" fill="url(#glow)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="800"/>
    <line x1="280" y1="0" x2="280" y2="800"/>
    <line x1="440" y1="0" x2="440" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="760" y1="0" x2="760" y2="800"/>
    <line x1="920" y1="0" x2="920" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Top Hero Header Bar -->
  <g transform="translate(60, 48)">
    <rect width="140" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="70" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.1em">AI BUILDER</text>
    <text x="160" y="24" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">ZYR0 Studio</text>
    <text x="350" y="23" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">— Prompt-to-production React 19 apps in 60s</text>
    
    <!-- Action pill on top right -->
    <rect x="940" y="4" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="958" cy="20" r="4" fill="#10b981"/>
    <text x="970" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">1-Click Deploy</text>
  </g>

  <!-- Widescreen IDE Window Mockup -->
  <g transform="translate(60, 110)">
    <!-- Window Frame -->
    <rect width="1080" height="630" rx="16" fill="#070a14" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="1080" height="630" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Window Header -->
    <rect width="1080" height="46" rx="16" fill="#0f172a" fill-opacity="0.9"/>
    <circle cx="28" cy="23" r="6" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="48" cy="23" r="6" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="68" cy="23" r="6" fill="#10b981" fill-opacity="0.8"/>
    <rect x="180" y="12" width="220" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="290" y="27" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">App.tsx — ZYR0 Visual Studio</text>
    <rect x="420" y="12" width="120" height="22" rx="6" fill="#0f172a"/>
    <text x="480" y="27" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">tailwind.config.js</text>

    <!-- Main Split Area -->
    <g transform="translate(24, 66)">
      <!-- Left: Prompt & Code Editor (width 480) -->
      <g>
        <!-- Prompt bar -->
        <rect width="490" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
        <text x="20" y="32" font-family="monospace" font-size="13" fill="#38bdf8">✦ "Create a clean SaaS analytics dashboard with dark theme"</text>

        <!-- Code lines panel -->
        <g transform="translate(0, 68)">
          <rect width="490" height="470" rx="12" fill="#060911" stroke="#1e293b" stroke-width="1"/>
          
          <!-- Line numbers & code text -->
          <g transform="translate(18, 30)" font-family="monospace" font-size="12" line-height="22">
            <text x="0" y="0" fill="#475569">01</text>
            <text x="32" y="0" fill="#f43f5e">import</text>
            <text x="86" y="0" fill="#f8fafc">{ useState, useEffect }</text>
            <text x="270" y="0" fill="#f43f5e">from</text>
            <text x="312" y="0" fill="#38bdf8">'react'</text>

            <text x="0" y="28" fill="#475569">02</text>
            <text x="32" y="28" fill="#f43f5e">import</text>
            <text x="86" y="28" fill="#f8fafc">{ AreaChart, StatCard }</text>
            <text x="276" y="28" fill="#f43f5e">from</text>
            <text x="318" y="28" fill="#38bdf8">'@/components'</text>

            <text x="0" y="56" fill="#475569">03</text>

            <text x="0" y="84" fill="#475569">04</text>
            <text x="32" y="84" fill="#818cf8">export default function</text>
            <text x="200" y="84" fill="#fde047">SaaSDashboard</text>
            <text x="310" y="84" fill="#f8fafc">() {</text>

            <text x="0" y="112" fill="#475569">05</text>
            <text x="48" y="112" fill="#818cf8">const</text>
            <text x="96" y="112" fill="#f8fafc">[metrics, setMetrics] =</text>
            <text x="270" y="112" fill="#38bdf8">useTelemetry()</text>

            <text x="0" y="140" fill="#475569">06</text>
            <text x="48" y="140" fill="#f43f5e">return</text>
            <text x="100" y="140" fill="#f8fafc">(</text>

            <text x="0" y="168" fill="#475569">07</text>
            <text x="64" y="168" fill="#38bdf8">&lt;div</text>
            <text x="104" y="168" fill="#a7f3d0">className="grid grid-cols-3 gap-6"</text>
            <text x="375" y="168" fill="#38bdf8">&gt;</text>

            <text x="0" y="196" fill="#475569">08</text>
            <text x="80" y="196" fill="#38bdf8">&lt;StatCard</text>
            <text x="160" y="196" fill="#a7f3d0">title="ARR" value="$128.4k" /&gt;</text>

            <text x="0" y="224" fill="#475569">09</text>
            <text x="80" y="224" fill="#38bdf8">&lt;StatCard</text>
            <text x="160" y="224" fill="#a7f3d0">title="Active Teams" value="1,240" /&gt;</text>

            <text x="0" y="252" fill="#475569">10</text>
            <text x="80" y="252" fill="#38bdf8">&lt;AreaChart</text>
            <text x="170" y="252" fill="#a7f3d0">data={metrics} height={240} /&gt;</text>

            <text x="0" y="280" fill="#475569">11</text>
            <text x="64" y="280" fill="#38bdf8">&lt;/div&gt;</text>

            <text x="0" y="308" fill="#475569">12</text>
            <text x="48" y="308" fill="#f8fafc">)</text>
            <text x="0" y="336" fill="#475569">13</text>
            <text x="32" y="336" fill="#f8fafc">}</text>
          </g>

          <!-- AI Status Tag -->
          <g transform="translate(18, 415)">
            <rect width="210" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3"/>
            <circle cx="28" cy="16" r="4" fill="#38bdf8"/>
            <text x="42" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Generated in 1.4s · Zero Errors</text>
          </g>
        </g>
      </g>

      <!-- Right: Live Canvas Preview (width 518) -->
      <g transform="translate(514, 0)">
        <rect width="518" height="538" rx="12" fill="#0a0f1d" stroke="#1e293b" stroke-width="1.5"/>

        <!-- Canvas Subheader -->
        <rect width="518" height="44" rx="12" fill="#0f172a" fill-opacity="0.7"/>
        <text x="24" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">LIVE PREVIEW</text>
        <rect x="420" y="10" width="80" height="24" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
        <text x="460" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">HOT RELOAD</text>

        <!-- Live Dashboard UI -->
        <g transform="translate(24, 64)">
          <!-- Top 3 Stat Cards -->
          <g>
            <rect width="144" height="84" rx="10" fill="#131c31" stroke="#1e293b" stroke-width="1"/>
            <text x="16" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Annual Revenue</text>
            <text x="16" y="60" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">$128.4k</text>
          </g>
          <g transform="translate(160, 0)">
            <rect width="144" height="84" rx="10" fill="#131c31" stroke="#1e293b" stroke-width="1"/>
            <text x="16" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Active Teams</text>
            <text x="16" y="60" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#818cf8">1,240</text>
          </g>
          <g transform="translate(320, 0)">
            <rect width="148" height="84" rx="10" fill="#131c31" stroke="#1e293b" stroke-width="1"/>
            <text x="16" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Uptime SLA</text>
            <text x="16" y="60" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#34d399">99.98%</text>
          </g>

          <!-- Interactive Chart Box -->
          <g transform="translate(0, 104)">
            <rect width="470" height="230" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
            <text x="20" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Telemetry Throughput (req/s)</text>
            
            <!-- Graph wave -->
            <path d="M 20 180 Q 90 90 160 140 T 300 80 T 450 110" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 20 180 Q 90 90 160 140 T 300 80 T 450 110 L 450 210 L 20 210 Z" fill="#38bdf8" fill-opacity="0.12"/>

            <!-- Second wave line -->
            <path d="M 20 195 Q 100 130 180 160 T 320 120 T 450 140" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
          </g>

          <!-- Bottom Action Row -->
          <g transform="translate(0, 354)">
            <rect width="470" height="80" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
            <text x="20" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Ready to ship?</text>
            <text x="20" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Sync directly with GitHub, Vercel, or Docker container</text>

            <rect x="330" y="24" width="120" height="34" rx="8" fill="#38bdf8"/>
            <text x="390" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#020617" text-anchor="middle">Deploy Now ↗</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
