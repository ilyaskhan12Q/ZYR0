<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0712"/>
      <stop offset="50%" stop-color="#2a0d1e"/>
      <stop offset="100%" stop-color="#0a0206"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="600" cy="380" r="420" fill="url(#glow)"/>

  <!-- Blueprint Grid -->
  <g stroke="#f43f5e" stroke-opacity="0.06" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="800"/>
    <line x1="280" y1="0" x2="280" y2="800"/>
    <line x1="440" y1="0" x2="440" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="760" y1="0" x2="760" y2="800"/>
    <line x1="920" y1="0" x2="920" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Top Hero Header Bar -->
  <g transform="translate(60, 48)">
    <rect width="150" height="32" rx="16" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.5"/>
    <text x="75" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle" letter-spacing="0.1em">DEEP AI AGENT</text>
    <text x="170" y="24" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">ZYR0 Research</text>
    <text x="405" y="23" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">— Autonomous multi-agent literature &amp; proof engine</text>
    
    <rect x="940" y="4" width="140" height="32" rx="8" fill="#4c0519" stroke="#881337" stroke-width="1"/>
    <circle cx="958" cy="20" r="4" fill="#fb7185"/>
    <text x="970" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fecdd3">142 arXiv Papers</text>
  </g>

  <!-- Widescreen Research Agent Workspace Mockup -->
  <g transform="translate(60, 110)">
    <rect width="1080" height="630" rx="16" fill="#11050c" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="1080" height="630" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Window Header -->
    <rect width="1080" height="46" rx="16" fill="#240715" fill-opacity="0.9"/>
    <circle cx="28" cy="23" r="6" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="48" cy="23" r="6" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="68" cy="23" r="6" fill="#10b981" fill-opacity="0.8"/>
    <text x="240" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fda4af">Research Agent · Citation Graph &amp; Proof Synthesis</text>

    <!-- Content: 2-column split (Graph on Left, Synthesized Paper & Proof on Right) -->
    <g transform="translate(24, 66)">
      <!-- Left: Interactive Citation & Evidence Graph (width 520) -->
      <g>
        <rect width="520" height="538" rx="12" fill="#190610" stroke="#3b0716" stroke-width="1.5"/>
        <rect width="520" height="44" rx="12" fill="#2d0a1b" fill-opacity="0.7"/>
        <text x="20" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">RECURSIVE EVIDENCE CITATION TREE</text>

        <!-- Node network diagram -->
        <g transform="translate(0, 50)">
          <!-- Connecting Lines -->
          <g stroke="#f43f5e" stroke-width="2" stroke-opacity="0.5">
            <line x1="90" y1="120" x2="260" y2="70"/>
            <line x1="260" y1="70" x2="430" y2="130"/>
            <line x1="90" y1="120" x2="160" y2="250"/>
            <line x1="260" y1="70" x2="260" y2="240"/>
            <line x1="430" y1="130" x2="360" y2="250"/>
            <line x1="160" y1="250" x2="260" y2="240"/>
            <line x1="260" y1="240" x2="360" y2="250"/>
            <line x1="260" y1="240" x2="260" y2="350"/>
          </g>

          <!-- Nodes -->
          <g>
            <circle cx="260" cy="70" r="32" fill="#881337" stroke="#f43f5e" stroke-width="2.5"/>
            <text x="260" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">PRIMARY</text>

            <circle cx="90" cy="120" r="26" fill="#4c0519" stroke="#fb7185" stroke-width="2"/>
            <text x="90" y="125" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">arXiv '24</text>

            <circle cx="430" cy="130" r="26" fill="#4c0519" stroke="#fb7185" stroke-width="2"/>
            <text x="430" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Nature</text>

            <circle cx="160" cy="250" r="22" fill="#3b0716" stroke="#f43f5e" stroke-width="1.5"/>
            <text x="160" y="254" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Proof A</text>

            <circle cx="260" cy="240" r="28" fill="#9f1239" stroke="#f43f5e" stroke-width="2"/>
            <text x="260" y="245" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">SYNTH</text>

            <circle cx="360" cy="250" r="22" fill="#3b0716" stroke="#f43f5e" stroke-width="1.5"/>
            <text x="360" y="254" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Proof B</text>

            <circle cx="260" cy="350" r="30" fill="#4c0519" stroke="#34d399" stroke-width="2.5"/>
            <text x="260" y="355" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">VERIFIED</text>
          </g>

          <!-- Citation summary badge -->
          <g transform="translate(30, 410)">
            <rect width="460" height="58" rx="8" fill="#2d0a1b" stroke="#881337" stroke-width="1"/>
            <text x="18" y="24" font-family="monospace" font-size="12" fill="#fda4af">Confidence Score: 99.8% · Zero Hallucinations Found</text>
            <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Every mathematical proposition checked by automated Z3 SMT solver</text>
          </g>
        </g>
      </g>

      <!-- Right: Synthesized Report & LaTeX Proofs (width 500) -->
      <g transform="translate(538, 0)">
        <rect width="500" height="538" rx="12" fill="#190610" stroke="#3b0716" stroke-width="1.5"/>
        <rect width="500" height="44" rx="12" fill="#2d0a1b" fill-opacity="0.7"/>
        <text x="20" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">SYNTHESIZED EXHAUSTIVE REPORT</text>

        <!-- Paper Body Content -->
        <g transform="translate(24, 64)">
          <text x="0" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Convergence Bounds in Sparse Attention Graphs</text>
          <text x="0" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#fda4af">Executive Summary · Cross-Referenced Across 14 Sources</text>

          <!-- LaTeX Math Box -->
          <g transform="translate(0, 60)">
            <rect width="452" height="90" rx="8" fill="#0d0308" stroke="#4c0519" stroke-width="1"/>
            <text x="20" y="36" font-family="serif" font-style="italic" font-size="17" fill="#fecdd3">∀ ε &gt; 0,  ∃ N₀ ∈ ℕ  s.t.  || A_k - A* ||_F &lt; ε · exp(-λ k)</text>
            <text x="20" y="68" font-family="monospace" font-size="11" fill="#94a3b8">Proof validated: SMT theorem prover verified step 4 under Lemma 2.3</text>
          </g>

          <!-- Bullet Points -->
          <g transform="translate(0, 170)" font-family="system-ui, sans-serif" font-size="13">
            <text x="0" y="0" font-weight="700" fill="#ffffff">Key Discoveries:</text>
            <text x="16" y="26" fill="#cbd5e1">• Memory consumption scales sub-linearly: O(N · log N)</text>
            <text x="16" y="52" fill="#cbd5e1">• 4x throughput acceleration over baseline dense Transformers</text>
            <text x="16" y="78" fill="#cbd5e1">• Zero gradient explosion over 128,000 sequence length tokens</text>
          </g>

          <!-- Action bar -->
          <g transform="translate(0, 290)">
            <rect width="452" height="60" rx="8" fill="#2d0a1b" stroke="#881337" stroke-width="1"/>
            <text x="20" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Export Publication-Ready Package</text>
            <text x="20" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Download complete LaTeX package, PDF, and BibTeX citations</text>
            <rect x="330" y="14" width="105" height="32" rx="6" fill="#f43f5e"/>
            <text x="382" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Export PDF</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
